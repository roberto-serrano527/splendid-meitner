<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4f46e5" />
      <stop offset="100%" stop-color="#7c3aed" />
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#f8fafc" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-opacity="0.25" />
    </filter>
  </defs>
  <!-- Background Rounded App Icon for Android -->
  <rect width="512" height="512" rx="112" fill="url(#grad)" />
  
  <!-- Back Card tilted -->
  <rect x="110" y="90" width="260" height="320" rx="24" fill="#818cf8" opacity="0.6" transform="rotate(-12 240 250)" />
  
  <!-- Front Card -->
  <rect x="136" y="106" width="260" height="320" rx="24" fill="url(#cardGrad)" filter="url(#shadow)" />
  
  <!-- Card Content: Letter / Word Icon & Spaced Repetition Rings -->
  <path d="M210 190 H320" stroke="#e2e8f0" stroke-width="10" stroke-linecap="round" />
  <text x="266" y="275" font-family="system-ui, sans-serif" font-size="76" font-weight="900" fill="#4f46e5" text-anchor="middle">Aa</text>
  <path d="M200 330 H332" stroke="#6366f1" stroke-width="8" stroke-linecap="round" />
  <circle cx="266" cy="370" r="14" fill="#10b981" />
</svg>
